name: lvverp

services:
  postgres:
    image: postgres:17-alpine
    container_name: lvverp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lvverp}
      POSTGRES_USER: ${POSTGRES_USER:-lvverp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lvverp_dev}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional DB admin UI: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: lvverp-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lvverp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
